{{ define "main" }}
<main class="aroma-shell flex-1 bg-aroma-cream px-4 py-14 text-aroma-deep md:px-8 md:py-20">
    <section class="mx-auto max-w-7xl">
        <div class="mb-10 max-w-3xl">
            <p class="text-xs font-bold uppercase tracking-[0.18em] text-aroma-green">{{ site.Title }}</p>
            <h1 class="mt-4 text-4xl font-light leading-tight md:text-6xl">{{ .Title | default site.Title }}</h1>
            {{ with .Description }}<p class="mt-5 text-base leading-7 text-aroma-deep/65">{{ . }}</p>{{ end }}
        </div>
        <div class="grid gap-5 md:grid-cols-3">
            {{ range .Pages }}
            <article class="bg-aroma-paper p-6">
                <a href="{{ .RelPermalink }}" class="block text-xl font-medium text-aroma-deep transition hover:text-aroma-green">{{ .Title }}</a>
                {{ with .Summary }}<p class="mt-3 text-sm leading-6 text-aroma-deep/65">{{ . }}</p>{{ end }}
            </article>
            {{ end }}
        </div>
    </section>
</main>
{{ end }}
