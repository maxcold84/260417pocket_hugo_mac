{{ define "main" }}
<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "ko-kr" }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title | default site.Title }} CMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bmw: {
                            blue: '#1C69D4',
                            dark: '#111111',
                            surface: '#1A1A1A',
                            border: '#e5e7eb',
                            darkBorder: '#333333'
                        }
                    }
                }
            }
        }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/pocketbase/dist/pocketbase.umd.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        /* Hide number input spin buttons */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield; /* Firefox */
        }
        /* Drag and drop image reorder */
        .img-drag-item { cursor: grab; user-select: none; }
        .img-drag-item:active { cursor: grabbing; }
        /* Drag and drop product row reorder */
        .product-drag-row { transition: background-color 0.1s ease; }
        .product-drag-row.dragging-row { opacity: 0.4; background-color: #f3f4f6; }
        .product-drag-row.drag-over-row { border-top: 2px solid #1C69D4; }
        /* Smooth, flicker-free drag targets */
        .dragging-active .product-drag-row td * { pointer-events: none; }
        .dragging-active .img-drag-item * { pointer-events: none; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans antialiased min-h-screen" x-data="cmsApp()">

    <!-- Toast Notification -->
    <div x-show="toastMsg" x-cloak x-transition
         :class="{
             'bg-red-700': toastType === 'error',
             'bg-green-700': toastType === 'success',
             'bg-gray-900': toastType === 'info' || !toastType
         }"
         class="fixed top-3 left-1/2 z-[100] w-[calc(100%-2rem)] max-w-lg -translate-x-1/2 rounded-lg px-4 py-3 text-center text-sm font-medium text-white shadow-xl whitespace-pre-line sm:top-4 sm:w-auto sm:px-6"
         x-text="toastMsg"></div>

    <!-- Login Screen -->
    <template x-if="!isLoggedIn">
        <div class="min-h-screen flex items-center justify-center bg-gray-50 px-4 py-8">
            <div class="max-w-md w-full p-6 sm:p-8 bg-white shadow-lg rounded-sm border border-gray-200">
                <h1 class="text-2xl font-light tracking-widest text-center mb-8 uppercase">{{ i18n "cms_login" }}</h1>
                <form @submit.prevent="login" class="space-y-6" autocomplete="off">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2 uppercase">{{ i18n "admin_email" }}</label>
                        <input type="email" x-model="email" autocomplete="off" required class="w-full border border-gray-300 p-3 rounded focus:ring-2 focus:ring-bmw-blue focus:border-bmw-blue outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2 uppercase">{{ i18n "password" }}</label>
                        <input type="password" x-model="password" autocomplete="new-password" required class="w-full border border-gray-300 p-3 rounded focus:ring-2 focus:ring-bmw-blue focus:border-bmw-blue outline-none transition">
                    </div>
                    <div x-show="error" class="text-red-500 text-sm p-3 bg-red-50 border border-red-200 rounded" x-text="error" style="display: none;"></div>
                    <button type="submit" class="w-full bg-bmw-blue hover:bg-blue-700 text-white p-3 rounded uppercase tracking-wider font-medium transition" :disabled="loading">
                        <span x-show="!loading">{{ i18n "login" }}</span>
                        <span x-show="loading">{{ i18n "authenticating" }}</span>
                    </button>
                </form>
            </div>
        </div>
    </template>

    <!-- Dashboard -->
    <template x-if="isLoggedIn">
        <div class="min-h-screen bg-gray-100 lg:flex lg:h-screen lg:overflow-hidden">
            <!-- Sidebar -->
            <aside class="hidden w-64 flex-shrink-0 flex-col border-r border-bmw-darkBorder bg-bmw-dark text-white shadow-xl lg:flex">
                <div class="h-16 flex items-center px-6 border-b border-bmw-darkBorder bg-black">
                    <span class="text-lg font-bold tracking-widest text-white">{{ site.Title | upper }} CMS</span>
                </div>
                <div class="flex-1 overflow-y-auto py-4">
                    <nav class="space-y-1.5 px-3">
                        <template x-for="item in navItems" :key="item.key">
                            <button type="button" @click="activateTab(item.key)"
                                    :class="navButtonClass(item.key)"
                                    class="group flex w-full items-center rounded-md px-4 py-3 text-sm font-medium uppercase transition-all duration-200">
                                <span class="mr-3 h-5 w-5 flex-shrink-0 transition-colors duration-200" :class="navIconClass(item.key)" x-html="item.icon"></span>
                                <span x-text="item.label"></span>
                            </button>
                        </template>
                    </nav>
                </div>
                <div class="p-4 border-t border-bmw-darkBorder bg-black">
                    <button @click="logout" class="w-full flex items-center px-4 py-3 text-sm text-gray-400 hover:text-white hover:bg-bmw-surface rounded-md transition-all duration-200 uppercase group">
                        <!-- Premium Logout Icon -->
                        <svg class="mr-3 h-5 w-5 flex-shrink-0 text-gray-500 group-hover:text-white transition-colors duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                        </svg>
                        {{ i18n "logout" }}
                    </button>
                </div>
            </aside>

            <div class="flex min-h-screen flex-1 flex-col lg:min-h-0">
                <header class="sticky top-0 z-30 bg-bmw-dark text-white shadow-xl lg:hidden">
                    <div class="flex min-h-14 items-center justify-between gap-3 px-4 py-3">
                        <div class="min-w-0">
                            <p class="truncate text-sm font-bold tracking-widest">{{ site.Title | upper }} CMS</p>
                            <p class="truncate text-xs uppercase text-gray-400" x-text="tabTitle()"></p>
                        </div>
                        <button type="button" @click="logout" class="shrink-0 rounded border border-white/15 px-3 py-2 text-xs font-medium uppercase text-gray-200 transition hover:bg-white/10">
                            {{ i18n "logout" }}
                        </button>
                    </div>
                    <nav class="flex gap-2 overflow-x-auto px-3 pb-3" aria-label="CMS sections">
                        <template x-for="item in navItems" :key="item.key">
                            <button type="button" @click="activateTab(item.key)"
                                    :class="mobileNavButtonClass(item.key)"
                                    class="flex min-w-max items-center gap-2 rounded-md px-3 py-2 text-xs font-bold uppercase transition">
                                <span class="h-4 w-4" x-html="item.icon"></span>
                                <span x-text="item.label"></span>
                            </button>
                        </template>
                    </nav>
                </header>

                <!-- Main Content -->
                <main class="flex-1 overflow-y-auto bg-gray-100 focus:outline-none">
                <div class="hidden h-16 items-center justify-between border-b border-gray-200 bg-white px-8 shadow-sm lg:sticky lg:top-0 lg:z-10 lg:flex">
                    <h2 class="text-xl font-light tracking-wide uppercase" x-text="tabTitle()"></h2>
                    <template x-if="currentTab === 'products'">
                        <div class="flex gap-4">
                            <button @click="rebuildSite" class="bg-gray-800 hover:bg-black text-white px-4 py-2 text-sm rounded transition shadow-sm border border-gray-600 flex items-center gap-2" :disabled="isRebuilding">
                                <span x-show="!isRebuilding">{{ i18n "sync_rebuild" }}</span>
                                <span x-show="isRebuilding">{{ i18n "processing" }}</span>
                            </button>
                            <button @click="openAddProductModal" class="bg-bmw-blue hover:bg-blue-700 text-white px-4 py-2 text-sm rounded transition shadow-sm">
                                + {{ i18n "add_product" }}
                            </button>
                        </div>
                    </template>
                </div>

                <template x-if="currentTab === 'products'">
                    <div class="border-b border-gray-200 bg-white px-4 py-3 lg:hidden">
                        <div class="grid grid-cols-2 gap-2">
                            <button @click="rebuildSite" class="flex min-h-11 items-center justify-center rounded bg-gray-800 px-3 py-2 text-sm font-medium text-white shadow-sm transition hover:bg-black disabled:opacity-60" :disabled="isRebuilding">
                                <span x-show="!isRebuilding">{{ i18n "sync_rebuild" }}</span>
                                <span x-show="isRebuilding">{{ i18n "processing" }}</span>
                            </button>
                            <button @click="openAddProductModal" class="flex min-h-11 items-center justify-center rounded bg-bmw-blue px-3 py-2 text-sm font-medium text-white shadow-sm transition hover:bg-blue-700">
                                + {{ i18n "add_product" }}
                            </button>
                        </div>
                    </div>
                </template>

                <div class="p-4 sm:p-6 lg:p-8">
                    <!-- Products Tab -->
                    <template x-if="currentTab === 'products'">
                        <div>
                            <!-- Products Stat Cards -->
                            <div class="mb-3 grid grid-cols-3 gap-1.5 sm:mb-4 sm:gap-2 lg:mb-5">
                                <template x-for="stat in productStatCards()" :key="stat.key">
                                    <div class="rounded-md border border-gray-200 bg-white px-2 py-1.5 shadow-sm ring-1 ring-black/[0.02] transition hover:border-gray-300 sm:rounded-lg sm:px-3 sm:py-2.5">
                                        <div class="flex items-start justify-between gap-1.5 sm:items-center sm:gap-3">
                                            <div class="min-w-0">
                                                <p class="truncate text-[9px] font-semibold uppercase tracking-wider text-gray-500 sm:text-[11px]">
                                                    <span class="sm:hidden" x-text="stat.shortLabel"></span>
                                                    <span class="hidden sm:inline" x-text="stat.label"></span>
                                                </p>
                                                <p class="mt-0.5 truncate text-[13px] font-semibold leading-none text-gray-950 sm:mt-1 sm:text-lg" :class="stat.valueClass" x-text="stat.value"></p>
                                            </div>
                                            <span class="flex h-5 w-5 shrink-0 items-center justify-center rounded-full sm:h-7 sm:w-7" :class="stat.iconClass" x-html="stat.icon"></span>
                                        </div>
                                    </div>
                                </template>
                            </div>
                            
                            <div class="bg-white shadow-sm rounded border border-gray-200 overflow-hidden">
                            <!-- Product Search and Filter Bar -->
                            <div class="p-4 border-b border-gray-200 bg-gray-50 flex flex-col gap-3 sm:flex-row sm:flex-wrap sm:items-center sm:justify-between lg:gap-4">
                                <div class="relative w-full sm:max-w-md">
                                    <input type="text" x-model="productSearchQuery" @input.debounce.500ms="fetchProducts()" placeholder="상품명 또는 슬러그로 검색" class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-bmw-blue focus:border-bmw-blue outline-none transition text-sm bg-white">
                                    <svg class="w-5 h-5 text-gray-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                                </div>
                                <div class="flex w-full flex-col gap-1 sm:w-auto sm:flex-row sm:items-center sm:gap-2">
                                    <label class="text-xs font-medium text-gray-600 sm:text-sm">카테고리 필터</label>
                                    <select x-model="cmsCategoryFilter" @change="fetchProducts()" class="w-full border border-gray-300 p-2 py-1.5 rounded focus:ring-2 focus:ring-bmw-blue focus:border-bmw-blue outline-none transition text-sm bg-white sm:min-w-[150px]">
                                        <option value="">전체보기</option>
                                        <template x-for="cat in dbCategories" :key="cat.id">
                                            <option :value="cat.id" x-text="cat.name"></option>
                                        </template>
                                    </select>
                                </div>
                            </div>
                            <table class="hidden min-w-full divide-y divide-gray-200 lg:table">
                                <thead class="bg-gray-50">
                                    <tr>
                                        <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-10"></th>
                                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">{{ i18n "product_image" }}</th>
                                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">{{ i18n "ui_name" }} / {{ i18n "ui_slug" }}</th>
                                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">카테고리</th>
                                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">{{ i18n "price" }} / {{ i18n "discount_price" }} (₩)</th>
                                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">{{ i18n "stock" }}</th>
                                        <th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">{{ i18n "actions" }}</th>
                                    </tr>
                                </thead>
                                <tbody class="bg-white divide-y divide-gray-200" :class="{'dragging-active': isProductDragging}">
                                    <template x-for="(product, pIdx) in products" :key="product.id">
                                        <tr class="hover:bg-gray-50 product-drag-row"
                                            draggable="true"
                                            @dragstart="productDragStart(pIdx, $event)"
                                            @dragover.prevent="productDragOver(pIdx, $event)"
                                            @dragleave="$event.currentTarget.classList.remove('drag-over-row')"
                                            @drop.prevent="productDrop(pIdx, $event)"
                                            @dragend="productDragEnd($event)">
                                            <td class="px-3 py-4 text-gray-400 cursor-grab active:cursor-grabbing">
                                                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M7 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM13 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM7 8a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM13 8a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM7 14a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM13 14a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>
                                            </td>
                                            <td class="px-4 py-4 whitespace-nowrap">
                                                <template x-if="product.images && product.images.length > 0">
                                                    <img :src="'/api/files/products/' + product.id + '/' + product.images[0]" class="w-12 h-12 object-cover rounded border border-gray-200 pointer-events-none">
                                                </template>
                                                <template x-if="!product.images || product.images.length === 0">
                                                    <div class="w-12 h-12 bg-gray-100 flex items-center justify-center text-xs text-gray-400 rounded border border-gray-200">IMG</div>
                                                </template>
                                            </td>
                                            <td class="px-4 py-4">
                                                <div class="text-sm font-medium text-gray-900" x-text="product.name"></div>
                                                <div class="text-sm text-gray-500" x-text="product.slug"></div>
                                            </td>
                                            <td class="px-4 py-4 whitespace-nowrap">
                                                <span x-text="product.expand?.category?.name || '미분류'" class="px-2.5 py-1 text-xs font-medium bg-gray-100 text-gray-800 rounded"></span>
                                            </td>
                                            <td class="px-4 py-4 whitespace-nowrap">
                                                <div class="text-sm font-medium text-gray-900" :class="{'line-through text-gray-400': product.discount_price > 0}" x-text="product.price.toLocaleString()"></div>
                                                <template x-if="product.discount_price > 0">
                                                    <div class="text-sm font-bold text-red-600" x-text="product.discount_price.toLocaleString()"></div>
                                                </template>
                                            </td>
                                            <td class="px-4 py-4 whitespace-nowrap text-sm text-gray-500">
                                                <input type="number" x-model.number="product.stock" @change="updateStock(product.id, product.stock)" class="w-20 border border-gray-300 p-1 text-sm rounded text-center">
                                            </td>
                                            <td class="px-4 py-4 whitespace-nowrap text-right text-sm font-medium space-x-3">
                                                <template x-if="deleteProductConfirmId !== product.id">
                                                    <div class="inline-flex gap-3">
                                                        <button @click="openEditProductModal(product)" class="text-bmw-blue hover:text-blue-900 font-medium">{{ i18n "edit_product" }}</button>
                                                        <button @click="deleteProductConfirmId = product.id" class="text-red-600 hover:text-red-900">{{ i18n "delete" }}</button>
                                                    </div>
                                                </template>
                                                <template x-if="deleteProductConfirmId === product.id">
                                                    <div class="inline-flex items-center gap-2 bg-red-50 border border-red-200 p-1.5 rounded">
                                                        <span class="text-xs text-red-700 font-medium">정말 삭제할까요?</span>
                                                        <button @click="deleteProduct(product.id)" class="bg-red-600 hover:bg-red-700 text-white text-xs px-2 py-1 rounded shadow">삭제</button>
                                                        <button @click="deleteProductConfirmId = ''" class="bg-gray-200 hover:bg-gray-300 text-gray-700 text-xs px-2 py-1 rounded">취소</button>
                                                    </div>
                                                </template>
                                            </td>
                                        </tr>
                                    </template>
                                    <template x-if="products.length === 0">
                                        <tr><td colspan="7" class="px-6 py-8 text-center text-gray-500">{{ i18n "no_products_found" }}</td></tr>
                                    </template>
                                </tbody>
                            </table>
                            <div class="divide-y divide-gray-200 lg:hidden">
                                <template x-for="(product, pIdx) in products" :key="product.id">
                                    <article class="bg-white p-4">
                                        <div class="flex gap-3">
                                            <div class="h-16 w-16 flex-shrink-0 overflow-hidden rounded border border-gray-200 bg-gray-100">
                                                <template x-if="product.images && product.images.length > 0">
                                                    <img :src="'/api/files/products/' + product.id + '/' + product.images[0]" class="h-full w-full object-cover">
                                                </template>
                                                <template x-if="!product.images || product.images.length === 0">
                                                    <div class="flex h-full w-full items-center justify-center text-xs text-gray-400">IMG</div>
                                                </template>
                                            </div>
                                            <div class="min-w-0 flex-1">
                                                <div class="flex items-start justify-between gap-2">
                                                    <div class="min-w-0">
                                                        <p class="truncate text-sm font-semibold text-gray-900" x-text="product.name"></p>
                                                        <p class="truncate text-xs text-gray-500" x-text="product.slug"></p>
                                                    </div>
                                                    <span class="shrink-0 rounded bg-gray-100 px-2 py-1 text-[11px] font-medium text-gray-700" x-text="productCategoryName(product)"></span>
                                                </div>
                                                <div class="mt-3 grid grid-cols-2 gap-3 text-sm">
                                                    <div>
                                                        <p class="text-[11px] font-medium uppercase text-gray-500">가격</p>
                                                        <p class="font-semibold text-gray-900" x-text="productDisplayPrice(product)"></p>
                                                    </div>
                                                    <div>
                                                        <p class="text-[11px] font-medium uppercase text-gray-500">재고</p>
                                                        <input type="number" x-model.number="product.stock" @change="updateStock(product.id, product.stock)" class="mt-1 w-full rounded border border-gray-300 p-2 text-center text-sm">
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="mt-4 flex flex-wrap items-center justify-between gap-2">
                                            <div class="inline-flex rounded border border-gray-200 bg-gray-50">
                                                <button type="button" @click="moveProduct(pIdx, -1)" :disabled="pIdx === 0" class="flex h-9 w-10 items-center justify-center text-gray-600 transition hover:bg-white disabled:cursor-not-allowed disabled:opacity-30" title="위로 이동">
                                                    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7" /></svg>
                                                </button>
                                                <button type="button" @click="moveProduct(pIdx, 1)" :disabled="pIdx === products.length - 1" class="flex h-9 w-10 items-center justify-center border-l border-gray-200 text-gray-600 transition hover:bg-white disabled:cursor-not-allowed disabled:opacity-30" title="아래로 이동">
                                                    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" /></svg>
                                                </button>
                                            </div>
                                            <template x-if="deleteProductConfirmId !== product.id">
                                                <div class="flex gap-2">
                                                    <button type="button" @click="openEditProductModal(product)" class="rounded border border-blue-200 bg-blue-50 px-3 py-2 text-xs font-bold text-bmw-blue">{{ i18n "edit_product" }}</button>
                                                    <button type="button" @click="deleteProductConfirmId = product.id" class="rounded border border-red-200 bg-red-50 px-3 py-2 text-xs font-bold text-red-600">{{ i18n "delete" }}</button>
                                                </div>
                                            </template>
                                            <template x-if="deleteProductConfirmId === product.id">
                                                <div class="flex w-full items-center justify-between gap-2 rounded border border-red-200 bg-red-50 p-2">
                                                    <span class="text-xs font-medium text-red-700">정말 삭제할까요?</span>
                                                    <div class="flex gap-2">
                                                        <button type="button" @click="deleteProduct(product.id)" class="rounded bg-red-600 px-3 py-1.5 text-xs font-bold text-white">삭제</button>
                                                        <button type="button" @click="deleteProductConfirmId = ''" class="rounded bg-white px-3 py-1.5 text-xs font-medium text-gray-700">취소</button>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </article>
                                </template>
                                <template x-if="products.length === 0">
                                    <div class="px-4 py-8 text-center text-sm text-gray-500">{{ i18n "no_products_found" }}</div>
                                </template>
                            </div>
                        </div>
                    </div>
                </template>

                    <!-- Orders Tab -->
                    <template x-if="currentTab === 'orders' || currentTab === 'orderArchive'">
                        <div>
                            <!-- Orders Stat Cards -->
                            <div class="mb-3 grid grid-cols-3 gap-1.5 sm:mb-4 sm:gap-2 lg:mb-5">
                                <template x-for="stat in orderStatCards()" :key="stat.key">
                                    <div class="rounded-md border border-gray-200 bg-white px-2 py-1.5 shadow-sm ring-1 ring-black/[0.02] transition hover:border-gray-300 sm:rounded-lg sm:px-3 sm:py-2.5">
                                        <div class="flex items-start justify-between gap-1.5 sm:items-center sm:gap-3">
                                            <div class="min-w-0">
                                                <p class="truncate text-[9px] font-semibold uppercase tracking-wider text-gray-500 sm:text-[11px]">
                                                    <span class="sm:hidden" x-text="stat.shortLabel"></span>
                                                    <span class="hidden sm:inline" x-text="stat.label"></span>
                                                </p>
                                                <p class="mt-0.5 truncate text-[13px] font-semibold leading-none text-gray-950 sm:mt-1 sm:text-lg" :class="stat.valueClass" x-text="stat.value"></p>
                                            </div>

                    { id: 'fire', label: 'Fire', svg: '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343A7.975 7.975 0 0120 13a7.975 7.975 0 01-2.343 5.657z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.879 16.121A3 3 0 1012.015 11L11 14H9c0 .768.293 1.536.879 2.121z"/></svg>' },

                isCatSaving: false,

                newProduct: {

                    slug: '',

                    discount_price: '',
                    stock: '',
                    category: ''
                },
                editProduct: {
                    id: '',
                    name: '',
                    slug: '',
                    description: '',
                    price: '',
                    discount_price: '',
                    stock: '',
                    category: '',
                    currentImages: []
                },
                dbCategories: [],
                init() {
                    if (this.isLoggedIn) {
                        document.cookie = pb.authStore.exportToCookie({ secure: false, httpOnly: false });
                        
                        const urlParams = new URLSearchParams(window.location.search);
                        const tab = urlParams.get('tab');
                        if (tab && this.navItems.some(item => item.key === tab)) {
                            this.currentTab = tab;
                        }
                        const archiveStatus = urlParams.get('archiveStatus');
                        if (archiveStatus && this.archivedOrderStatuses.includes(archiveStatus)) {
                            this.archiveStatusFilter = archiveStatus;
                        }

                        if (this.currentTab === 'orders' || this.currentTab === 'orderArchive') {
                            this.fetchOrders();
                        } else if (this.currentTab === 'comments') {
                            this.fetchComments();
                        } else if (this.currentTab === 'inquiries') {
                            this.fetchInquiries();
                        } else if (this.currentTab === 'coupons') {
                            this.fetchCouponDashboard();
                        } else if (this.currentTab === 'settings') {
                            this.fetchSettings();
                        } else {
                            this.fetchProducts();
                        }
                        this.fetchDbCategories();
                    }
                    // Auto-slugify new product name (supports Korean IME)
                    this.$watch('newProduct.name', val => {
                        if (!this.slugTouched) {
                            this.newProduct.slug = val.toLowerCase().replace(/[^a-z0-9가-힣ㄱ-ㅎㅏ-ㅣ]+/g, '-').replace(/-+/g, '-').replace(/(^-|-$)+/g, '');
                        }
                    });
                    // Auto-slugify new category english name
                    this.$watch('newCatNameEn', val => {
                        if (!this.catSlugTouched) {
                            this.newCatSlug = val.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/-+/g, '-').replace(/(^-|-$)+/g, '');
                        }
                    });
                },
                async fetchDbCategories() {
                    try {
                        const result = await pb.collection('categories').getFullList({ sort: 'sort_order' });
                        this.dbCategories = result;
                    } catch (err) {
                        console.error('카테고리 로드 실패:', err);
                    }
                },
                async categoryAdd() {
                    if (!this.newCatName || !this.newCatSlug) {
                        this.showToast('카테고리 이름과 슬러그는 필수입니다.');
                        return;
                    }
                    this.isCatSaving = true;
                    try {
                        const response = await pb.send('/api/cms/categories/add', {
                            method: 'POST',
                            body: {
                                name: this.newCatName,
                                nameEn: this.newCatNameEn || this.newCatName,
                                slug: this.newCatSlug,
                                icon: this.newCatIcon || 'lightning'
                            }
                        });
                        this.newCatName = '';
                        this.newCatNameEn = '';
                        this.newCatSlug = '';
                        this.newCatIcon = 'lightning';
                        this.catSlugTouched = false;
                        await this.fetchDbCategories();
                        this.showToast(response.message || '카테고리가 추가되었습니다.');
                    } catch (err) {
                        this.handleError(err, '카테고리 추가 실패');
                    } finally {
                        this.isCatSaving = false;
                    }
                },
                async categoryDelete(id) {
                    this.isCatDeleting = true;
                    try {
                        const response = await pb.send('/api/cms/categories/delete', {
                            method: 'POST',
                            body: { id }
                        });
                        
                        // Clear selected category on modals if it matches deleted ID
                        if (this.newProduct.category === id) {
                            this.newProduct.category = '';
                        }
                        if (this.editProduct.category === id) {
                            this.editProduct.category = '';
                        }
                        
                        this.deleteCategoryConfirmId = '';
                        await this.fetchDbCategories();
                        await this.fetchProducts(); // Refresh products to display updated category bindings
                        this.showToast(response.message || '카테고리가 삭제되었습니다.');
                    } catch (err) {
                        this.handleError(err, '카테고리 삭제 실패');
                    } finally {
                        this.isCatDeleting = false;
                    }
                },
                handleError(err, defaultMsg = '오류가 발생했습니다') {
                    if (err.status === 401 || err.status === 403) {
                        this.showToast('권한이 없거나 세션이 만료되었습니다. 다시 로그인해주세요.');
                        setTimeout(() => this.logout(), 2000);
                        return;
                    }
                    console.error(defaultMsg, err);
                    this.showToast(`${defaultMsg}: ${err.message || JSON.stringify(err.data || err)}`);
                },
                activateTab(tab) {
                    if (!this.navItems.some(item => item.key === tab)) return;
                    this.currentTab = tab;
                    this.cancelConfirmId = '';

                        this.error = err.message || 'Invalid credentials.';

                        this.loading = false;
                    }
                },
                logout() {
                    pb.authStore.clear();
                    document.cookie = 'pb_auth=; Max-Age=0; path=/';
                    this.isLoggedIn = false;
                    window.location.href = '/';
                },
                async fetchProducts() {
                    try {
                        let filters = [];
                        if (this.productSearchQuery) {
                            filters.push(`(name ~ "${this.productSearchQuery.replace(/"/g, '\\"')}" || slug ~ "${this.productSearchQuery.replace(/"/g, '\\"')}")`);
                        }
                        if (this.cmsCategoryFilter) {
                            filters.push(`category = "${this.cmsCategoryFilter}"`);
                        }
                        const filterStr = filters.join(' && ');

                        const result = await pb.collection('products').getList(1, 50, { 
                            sort: 'sort_order',
                            expand: 'category',
                            filter: filterStr || undefined
                        });
                        this.products = result.items;
                        // 상품 목록 갱신 시 기존 삭제 확인 ID 초기화
                        this.deleteProductConfirmId = '';
                    } catch (err) {
                        if (err.status === 401) this.logout();
                        console.error('Error fetching products:', err);
                    }
                },
                async fetchAllOrders(filter) {
                    const pageSize = 100;
                    const allOrders = [];
                    for (let page = 1; ; page += 1) {
                        const result = await pb.collection('orders').getList(page, pageSize, {
                            expand: 'user',
                            filter: filter
                        });
                        allOrders.push(...result.items);
                        if (page >= result.totalPages || result.items.length < pageSize) break;
                    }
                    return allOrders;
                },
                async fetchOrders() {
                    try {
                        const filters = [this.orderStatusFilter()];
                        if (this.orderSearchQuery) {
                            const q = this.orderSearchQuery.replace(/"/g, '\\"');
                            filters.push(`(id ~ "${q}" || portone_tx_id ~ "${q}" || user.email ~ "${q}" || guest_info.email ~ "${q}" || guest_info.phone ~ "${q}" || guest_info.name ~ "${q}")`);
                        }
                        let finalOrders = await this.fetchAllOrders(filters.join(' && '));
                        if (this.orderSearchQuery) {
                            const sq = this.orderSearchQuery.toLowerCase();
                            finalOrders = finalOrders.filter(o => 
                                o.id.toLowerCase().includes(sq) ||
                                (o.portone_tx_id && o.portone_tx_id.toLowerCase().includes(sq)) ||
                                (o.expand?.user?.email && o.expand.user.email.toLowerCase().includes(sq)) ||
                                (o.guest_info?.email && o.guest_info.email.toLowerCase().includes(sq)) ||
                                (o.guest_info?.phone && o.guest_info.phone.toLowerCase().includes(sq)) ||
                                (o.guest_info?.name && o.guest_info.name.toLowerCase().includes(sq))
                            );
                        }
                        finalOrders.sort((left, right) => String(right.created || '').localeCompare(String(left.created || '')));
                        if (this.currentTab === 'orderArchive') {
                            this.archiveOrders = finalOrders;
                            this.refreshArchiveCounts(finalOrders);
                            this.orders = this.filteredArchiveOrders();
                        } else {
                            this.archiveOrders = [];
                            this.orders = finalOrders;
                        }
                        this.cancelConfirmId = '';
                        this.deleteOrderConfirmId = '';
                    } catch (err) {
                        if (err.status === 401) this.logout();
                        console.error('Error fetching orders:', err);
                    }
                },
                async fetchSettings() {
                    try {
                        const data = await pb.send('/api/cms/settings', { method: 'GET' });
                        this.tomlContent = data.toml || '';
                    } catch (err) {
                        if (err.status === 401) this.logout();
                        console.error('Error fetching settings:', err);
                        this.handleError(err, '설정 불러오기 실패');
                    }
                },
                async fetchCouponDashboard() {
                    await Promise.all([this.fetchCouponSetting(), this.fetchCoupons()]);
                },
                async fetchCouponSetting() {
                    this.couponSettingLoading = true;
                    try {
                        const data = await pb.send('/api/cms/coupon-settings', { method: 'GET' });
                        if (data.setting) {
                            this.couponSetting = {
                                enabled: !!data.setting.enabled,
                                discountType: data.setting.discountType || 'fixed',
                                discountValue: Number(data.setting.discountValue) || 5000,
                                expiresDays: Number(data.setting.expiresDays) || 30,
                                minimumOrderAmount: Number(data.setting.minimumOrderAmount) || 0,
                                maxDiscountAmount: Number(data.setting.maxDiscountAmount) || 0
                            };
                        }
                    } catch (err) {
                        this.handleError(err, '쿠폰 설정 불러오기 실패');
                    } finally {
                        this.couponSettingLoading = false;
                    }
                },
                async saveCouponSetting() {
                    const discountValue = Number(this.couponSetting.discountValue);
                    const expiresDays = Number(this.couponSetting.expiresDays);
                    const minimumOrderAmount = Number(this.couponSetting.minimumOrderAmount);
                    const maxDiscountAmount = Number(this.couponSetting.maxDiscountAmount);
                    if (!Number.isFinite(discountValue) || discountValue < 1) {
                        this.showToast('쿠폰 할인값은 1 이상이어야 합니다.', 'error');
                        return;
                    }
                    if (!Number.isInteger(discountValue)) {
                        this.showToast('쿠폰 할인값은 정수로 입력해 주세요.', 'error');
                        return;
                    }
                    if (this.couponSetting.discountType === 'percent' && discountValue > 100) {
                        this.showToast('정률 쿠폰 할인율은 100%를 넘을 수 없습니다.', 'error');
                        return;
                    }
                    if (!Number.isFinite(expiresDays) || expiresDays < 1 || !Number.isInteger(expiresDays)) {
                        this.showToast('쿠폰 유효기간은 1일 이상 정수로 입력해 주세요.', 'error');
                        return;
                    }
                    if (!Number.isFinite(minimumOrderAmount) || minimumOrderAmount < 0 || !Number.isInteger(minimumOrderAmount)) {
                        this.showToast('최소 주문금액은 0원 이상 정수로 입력해 주세요.', 'error');
                        return;
                    }
                    if (!Number.isFinite(maxDiscountAmount) || maxDiscountAmount < 0 || !Number.isInteger(maxDiscountAmount)) {
                        this.showToast('최대 할인액은 0원 이상 정수로 입력해 주세요.', 'error');
                        return;
                    }
                    this.couponSetting.discountValue = discountValue;
                    this.couponSetting.expiresDays = expiresDays;
                    this.couponSetting.minimumOrderAmount = minimumOrderAmount;
                    this.couponSetting.maxDiscountAmount = maxDiscountAmount;
                    this.couponSaving = true;
                    try {
                        const data = await pb.send('/api/cms/coupon-settings', {
                            method: 'POST',
                            body: this.couponSetting
                        });
                        if (data.setting) {
                            this.couponSetting = {
                                enabled: !!data.setting.enabled,
                                discountType: data.setting.discountType || 'fixed',
                                discountValue: Number(data.setting.discountValue) || 5000,
                                expiresDays: Number(data.setting.expiresDays) || 30,
                                minimumOrderAmount: Number(data.setting.minimumOrderAmount) || 0,
                                maxDiscountAmount: Number(data.setting.maxDiscountAmount) || 0
                            };
                        }
                        this.showToast(data.message || '쿠폰 설정이 저장되었습니다.', 'success');
                    } catch (err) {
                        this.handleError(err, '쿠폰 설정 저장 실패');
                    } finally {
                        this.couponSaving = false;
                    }
                },
                async fetchCoupons() {
                    this.couponsLoading = true;
                    try {
                        const data = await pb.send('/api/cms/coupons', { method: 'GET' });
                        this.coupons = data.items || [];
                    } catch (err) {
                        this.handleError(err, '쿠폰 내역 불러오기 실패');
                    } finally {
                        this.couponsLoading = false;
                    }
                },
                filteredCoupons() {
                    const query = this.couponSearchQuery.trim().toLowerCase();
                    return this.coupons.filter(coupon => {
                        if (this.couponStatusFilter && coupon.status !== this.couponStatusFilter) {
                            return false;
                        }
                        if (!query) return true;
                        const values = [
                            coupon.code,
                            coupon.userEmail,
                            coupon.userName,
                            coupon.productName,
                            coupon.productSlug,
                            coupon.status
                        ];
                        return values.some(value => String(value || '').toLowerCase().includes(query));
                    });
                },
                couponStatusLabel(status) {
                    const labels = {
                        available: '사용 가능',
                        reserved: '예약',
                        used: '사용 완료',
                        expired: '만료',
                        void: '무효'
                    };
                    return labels[status] || status;
                },
                couponStatusClass(status) {
                    if (status === 'available') return 'bg-green-100 text-green-700';
                    if (status === 'reserved') return 'bg-blue-100 text-blue-700';
                    if (status === 'used') return 'bg-gray-900 text-white';
                    if (status === 'expired') return 'bg-orange-100 text-orange-700';
                    return 'bg-red-100 text-red-700';
                },
                couponBenefitLabel(coupon) {
                    const value = Number(coupon.discountValue || 0);
                    const benefit = coupon.discountType === 'percent' ? value + '%' : this.formatCurrency(value);
                    const minimum = Number(coupon.minimumOrderAmount || 0) > 0 ? ' · 최소 ' + this.formatCurrency(coupon.minimumOrderAmount) : '';
                    const max = Number(coupon.maxDiscountAmount || 0) > 0 ? ' · 최대 ' + this.formatCurrency(coupon.maxDiscountAmount) : '';
                    return benefit + ' 할인' + minimum + max;
                },
                couponUserLabel(coupon) {
                    return coupon.userName || coupon.userEmail || '회원';
                },
                couponSourceLabel(coupon) {
                    if (coupon.sourceType === 'review_reward') {
                        return coupon.productName ? '리뷰 보상 · ' + coupon.productName : '리뷰 보상';
                    }
                    return coupon.sourceType || '기타';
                },
                async saveSettings() {
                    this.loading = true;
                    try {
                        await pb.send('/api/cms/settings/update', { 
                            method: 'POST',
                            body: { toml: this.tomlContent }
                        });
                        this.showToast('설정이 저장되었고 사이트가 재빌드되었습니다.');
                    } catch (err) {
                        this.handleError(err, '설정 저장 실패');
                    } finally {
                        this.loading = false;
                    }
                },
                async updateStock(id, newStock) {
                    try {
                        const stockValue = newStock === '' ? 0 : Number(newStock);
                        await pb.collection('products').update(id, { stock: stockValue });
                    } catch (err) {
                        this.handleError(err, '재고 업데이트 실패');
                        this.fetchProducts();
                    }
                },
                // --- Product row drag-and-drop reorder ---
                productDragIdx: null,
                moveProduct(index, direction) {
                    const targetIndex = index + direction;
                    if (targetIndex < 0 || targetIndex >= this.products.length) return;
                    const list = [...this.products];
                    list.splice(targetIndex, 0, list.splice(index, 1)[0]);
                    this.products = list;
                    this.saveProductOrder();
                },
                productDragStart(index, event) {
                    // Guard: ignore drag from interactive form elements
                    if (['INPUT', 'SELECT', 'BUTTON', 'A'].includes(event.target.tagName)) {
                        event.preventDefault();
                        return;
                    }
                    this.productDragIdx = index;
                    event.currentTarget.classList.add('dragging-row');
                    event.dataTransfer.effectAllowed = 'move';
                    event.dataTransfer.setData('text/plain', String(index));
                    setTimeout(() => {
                        this.isProductDragging = true;
                    }, 0);
                },
                productDragOver(index, event) {
                    if (this.productDragIdx === null || this.productDragIdx === index) return;
                    event.dataTransfer.dropEffect = 'move';
                    event.currentTarget.classList.add('drag-over-row');
                },
                productDrop(targetIndex, event) {
                    event.currentTarget.classList.remove('drag-over-row');
                    const fromIndex = this.productDragIdx;
                    if (fromIndex === null || fromIndex === targetIndex) {
                        this.isProductDragging = false;
                        return;
                    }
                    const list = [...this.products];
                    list.splice(targetIndex, 0, list.splice(fromIndex, 1)[0]);
                    this.products = list;
                    this.productDragIdx = null;
                    this.isProductDragging = false;
                    this.saveProductOrder();
                },
                productDragEnd(event) {
                    event.currentTarget.classList.remove('dragging-row');
                    this.productDragIdx = null;
                    this.isProductDragging = false;
                    document.querySelectorAll('.drag-over-row').forEach(el => el.classList.remove('drag-over-row'));
                },
                async saveProductOrder() {
                    try {
                        await pb.send('/api/cms/products/reorder', {
                            method: 'POST',
                            body: { ids: this.products.map(p => p.id) }
                        });
                        this.showToast('상품 순서가 저장되었습니다.');
                    } catch (err) {
                        this.handleError(err, '순서 저장 실패');
                    }
                },
                async updateOrderStatus(id, newStatus) {
                    try {
                        await pb.send('/api/cms/orders/' + id + '/status', {
                            method: 'POST',
                            body: { status: newStatus }
                        });
                        let message = '주문 상태가 변경되었습니다.';
                        if (this.currentTab === 'orders' && this.isArchivedOrderStatus(newStatus)) {
                            message = '주문 상태가 변경되어 보관함으로 이동했습니다.';
                        } else if (this.currentTab === 'orderArchive' && !this.isArchivedOrderStatus(newStatus)) {
                            message = '주문 상태가 변경되어 주문 관리로 이동했습니다.';
                        }
                        this.showToast(message);
                        this.fetchOrders();
                    } catch (err) {
                        this.handleError(err, '주문 상태 업데이트 실패');
                        this.fetchOrders();
                    }
                },
                async deleteProduct(id) {
                    try {
                        const orderItems = await pb.collection('order_items').getFullList({
                            filter: `product = "${id}"`
                        });
                        for (const item of orderItems) {
                            await pb.collection('order_items').delete(item.id);
                        }
                        await pb.collection('products').delete(id);
                        this.deleteProductConfirmId = '';
                        this.fetchProducts();
                        this.showToast('상품이 삭제되었습니다.');
                    } catch (err) {
                        this.handleError(err, '상품 삭제 실패');
                    }
                },
                showToast(msg, type, duration) {
                    this.toastMsg = msg;
                    this.toastType = type || 'info'; // 'info' | 'success' | 'error'
                    const ms = duration || 4000;
                    clearTimeout(this._toastTimer);
                    this._toastTimer = setTimeout(() => { this.toastMsg = ''; this.toastType = 'info'; }, ms);
                },
                isCancellable(status) {
                    const cancellableStatuses = ['cancel_requested'];
                    return cancellableStatuses.includes(status);
                },
                async approveCancel(id) {
                    this.cancelApproving = true;
                    try {
                        await pb.send('/api/cms/orders/' + id + '/approve-cancel', { method: 'POST' });
                        this.cancelConfirmId = '';
                        this.showToast('환불이 완료되어 보관함으로 이동했습니다.');
                        this.fetchOrders();
                    } catch (err) {
                        this.showToast(err.data?.error || err.message || '환불 처리 실패');
                    } finally {
                        this.cancelApproving = false;
                    }
                },
                async deleteOrder(id) {
                    try {
                        // Cascade: delete associated order_items first
                        const items = await pb.collection('order_items').getFullList({ filter: `order = "${id}"` });
                        for (const item of items) {
                            await pb.collection('order_items').delete(item.id);
                        }
                        await pb.collection('orders').delete(id);
                        this.deleteOrderConfirmId = '';
                        this.fetchOrders();
                        this.showToast('주문 내역이 삭제되었습니다.');
                    } catch (err) {
                        this.handleError(err, '주문 삭제 실패');
                    }
                },
                // --- Image handling for Add Product (unified list) ---

                            this.addImageKeyCounter++;
                            this.addImageList = [...this.addImageList, {
                                file: file,
                                preview: e.target.result,
                                dragKey: 'add-' + this.addImageKeyCounter
                            }];
                        };
                        reader.readAsDataURL(file);
                    }
                    event.target.value = '';

                openAddProductModal() {
                    this.newProduct = { name: '', slug: '', description: '', price: '', discount_price: '', stock: '', category: '' };
                    this.slugTouched = false;
                    this.addImageList = [];
                    this.addImageKeyCounter = 0;

                openEditProductModal(product) {

                    this.editProduct = {
                        id: product.id,
                        name: product.name,
                        slug: product.slug,
                        description: product.description,
                        price: product.price,
                        discount_price: product.discount_price || '',
                        stock: product.stock,

                    };
                    // Build unified image list from existing images

                async createProduct() {
                    // 유효성 검증 (보안 및 데이터 정합성 강화)
                    if (Number(this.newProduct.price) < 0 || Number(this.newProduct.stock) < 0) {
                        this.showToast('가격과 재고는 0 이상이어야 합니다.');
                        return;
                    }
                    if (Number(this.newProduct.discount_price) > 0 && Number(this.newProduct.discount_price) >= Number(this.newProduct.price)) {
                        this.showToast('할인 가격은 원래 가격보다 작아야 합니다.');
                        return;
                    }

                    this.loading = true;
                    try {
                        const formData = new FormData();
                        formData.append('name', this.newProduct.name);
                        formData.append('slug', this.newProduct.slug);
                        formData.append('description', this.newProduct.description);
                        formData.append('price', Number(this.newProduct.price) || 0);
                        formData.append('discount_price', Number(this.newProduct.discount_price) || 0);
                        formData.append('stock', Number(this.newProduct.stock) || 0);
                        if (this.newProduct.category) {
                            formData.append('category', this.newProduct.category);
                        }

                        // Use stored files from state (not $refs which don't work in x-teleport)
                        for (const img of this.addImageList) {
                            formData.append('images', img.file);
                        }

                        await pb.collection('products').create(formData);
                        this.showAddModal = false;
                        this.addImageList = [];
                        this.addImageKeyCounter = 0;
                        this.fetchProducts();
                        this.showToast('상품이 등록되었습니다.');
                    } catch (err) {
                        this.handleError(err, '상품 등록 실패');
                    } finally {
                        this.loading = false;
                    }
                },

                    }

                        this.showToast('할인 가격은 원래 가격보다 작아야 합니다.');
                        return;
                    }

                    this.loading = true;
                    try {
                        const formData = new FormData();
                        formData.append('name', this.editProduct.name);
                        formData.append('slug', this.editProduct.slug);
                        formData.append('description', this.editProduct.description);
                        formData.append('price', Number(this.editProduct.price) || 0);
                        formData.append('discount_price', Number(this.editProduct.discount_price) || 0);
                        formData.append('stock', Number(this.editProduct.stock) || 0);
                        // Send category (empty string clears the relation)
                        formData.append('category', this.editProduct.category || '');

                        // Send the complete ordered image list.
                        // Existing images: send filename string to keep them.
                        // New images: send File object to upload.
                        // The order in FormData determines the final order.
                        for (const img of this.editImageList) {
                            if (img.type === 'existing') {
                                formData.append('images', img.filename);
                            } else {
                                formData.append('images', img.file);
                            }
                        }

                        await pb.collection('products').update(this.editProduct.id, formData);
                        this.showEditModal = false;
                        this.editImageList = [];
                        this.fetchProducts();
                        this.showToast('상품이 수정되었습니다.');
                    } catch (err) {
                        this.handleError(err, '상품 수정 실패');
                    } finally {
                        this.loading = false;
                    }
                }
            }
        }
    </script>
</body>
</html>
{{ end }}
