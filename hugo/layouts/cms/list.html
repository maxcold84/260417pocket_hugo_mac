{{ define "main" }}
<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "ko-kr" }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title | default site.Title }} CMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bmw: {
                            blue: '#1C69D4',
                            dark: '#111111',
                            surface: '#1A1A1A',
                            border: '#e5e7eb',
                            darkBorder: '#333333'
                        }
                    }
                }
            }
        }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/pocketbase/dist/pocketbase.umd.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        /* Hide number input spin buttons */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield; /* Firefox */
        }
        /* Drag and drop image reorder */
        .img-drag-item { cursor: grab; user-select: none; }
        .img-drag-item:active { cursor: grabbing; }
        /* Drag and drop product row reorder */
        .product-drag-row { transition: background-color 0.1s ease; }
        .product-drag-row.dragging-row { opacity: 0.4; background-color: #f3f4f6; }
        .product-drag-row.drag-over-row { border-top: 2px solid #1C69D4; }
        /* Smooth, flicker-free drag targets */
        .dragging-active .product-drag-row td * { pointer-events: none; }
        .dragging-active .img-drag-item * { pointer-events: none; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans antialiased min-h-screen" x-data="cmsApp()">

    <!-- Toast Notification -->
    <div x-show="toastMsg" x-cloak x-transition
         :class="{
             'bg-red-700': toastType === 'error',
             'bg-green-700': toastType === 'success',
             'bg-gray-900': toastType === 'info' || !toastType
         }"
         class="fixed top-4 left-1/2 -translate-x-1/2 z-[100] text-white px-6 py-3 rounded-lg shadow-xl text-sm font-medium max-w-lg text-center whitespace-pre-line"
         x-text="toastMsg"></div>

    <!-- Login Screen -->
    <template x-if="!isLoggedIn">
        <div class="min-h-screen flex items-center justify-center bg-gray-50">
            <div class="max-w-md w-full p-8 bg-white shadow-lg rounded-sm border border-gray-200">
                <h1 class="text-2xl font-light tracking-widest text-center mb-8 uppercase">{{ i18n "cms_login" }}</h1>
                <form @submit.prevent="login" class="space-y-6" autocomplete="off">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2 uppercase">{{ i18n "admin_email" }}</label>
                        <input type="email" x-model="email" autocomplete="off" required class="w-full border border-gray-300 p-3 rounded focus:ring-2 focus:ring-bmw-blue focus:border-bmw-blue outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2 uppercase">{{ i18n "password" }}</label>
                        <input type="password" x-model="password" autocomplete="new-password" required class="w-full border border-gray-300 p-3 rounded focus:ring-2 focus:ring-bmw-blue focus:border-bmw-blue outline-none transition">
                    </div>
                    <div x-show="error" class="text-red-500 text-sm p-3 bg-red-50 border border-red-200 rounded" x-text="error" style="display: none;"></div>
                    <button type="submit" class="w-full bg-bmw-blue hover:bg-blue-700 text-white p-3 rounded uppercase tracking-wider font-medium transition" :disabled="loading">
                        <span x-show="!loading">{{ i18n "login" }}</span>
                        <span x-show="loading">{{ i18n "authenticating" }}</span>
                    </button>
                </form>
            </div>
        </div>
    </template>

    <!-- Dashboard -->
    <template x-if="isLoggedIn">
        <div class="flex h-screen overflow-hidden">
            <!-- Sidebar -->
            <aside class="w-64 bg-bmw-dark text-white flex flex-col flex-shrink-0 border-r border-bmw-darkBorder shadow-xl">
                <div class="h-16 flex items-center px-6 border-b border-bmw-darkBorder bg-black">
                    <span class="text-lg font-bold tracking-widest text-white">{{ site.Title | upper }} CMS</span>
                </div>
                <div class="flex-1 overflow-y-auto py-4">
                    <nav class="space-y-1.5 px-3">
                        <button @click="currentTab = 'products'; fetchProducts()" 
                                :class="{'bg-bmw-blue text-white shadow-lg shadow-bmw-blue/20': currentTab === 'products', 'text-gray-300 hover:bg-bmw-surface hover:text-white': currentTab !== 'products'}"
                                class="w-full flex items-center px-4 py-3 text-sm font-medium rounded-md transition-all duration-200 uppercase group">
                            <!-- Premium Catalog Grid Icon -->
                            <svg class="mr-3 h-5 w-5 flex-shrink-0 transition-colors duration-200" :class="{'text-white': currentTab === 'products', 'text-gray-400 group-hover:text-white': currentTab !== 'products'}" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
                            </svg>
                            {{ i18n "catalog" }}
                        </button>
                        <button @click="currentTab = 'orders'; fetchOrders()" 
                                :class="{'bg-bmw-blue text-white shadow-lg shadow-bmw-blue/20': currentTab === 'orders', 'text-gray-300 hover:bg-bmw-surface hover:text-white': currentTab !== 'orders'}"
                                class="w-full flex items-center px-4 py-3 text-sm font-medium rounded-md transition-all duration-200 uppercase group">
                            <!-- Premium Orders Bag Icon -->
                            <svg class="mr-3 h-5 w-5 flex-shrink-0 transition-colors duration-200" :class="{'text-white': currentTab === 'orders', 'text-gray-400 group-hover:text-white': currentTab !== 'orders'}" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                            </svg>
                            {{ i18n "orders" }}
                        </button>
                        <button @click="currentTab = 'settings'; fetchSettings()" 
                                :class="{'bg-bmw-blue text-white shadow-lg shadow-bmw-blue/20': currentTab === 'settings', 'text-gray-300 hover:bg-bmw-surface hover:text-white': currentTab !== 'settings'}"
                                class="w-full flex items-center px-4 py-3 text-sm font-medium rounded-md transition-all duration-200 uppercase group">
                            <!-- Premium Settings Cog Icon -->
                            <svg class="mr-3 h-5 w-5 flex-shrink-0 transition-colors duration-200" :class="{'text-white': currentTab === 'settings', 'text-gray-400 group-hover:text-white': currentTab !== 'settings'}" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            </svg>
                            사이트 설정
                        </button>
                    </nav>
                </div>
                <div class="p-4 border-t border-bmw-darkBorder bg-black">
                    <button @click="logout" class="w-full flex items-center px-4 py-3 text-sm text-gray-400 hover:text-white hover:bg-bmw-surface rounded-md transition-all duration-200 uppercase group">
                        <!-- Premium Logout Icon -->
                        <svg class="mr-3 h-5 w-5 flex-shrink-0 text-gray-500 group-hover:text-white transition-colors duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                        </svg>
                        {{ i18n "logout" }}
                    </button>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="flex-1 overflow-y-auto bg-gray-100 focus:outline-none">
                <div class="h-16 flex items-center px-8 border-b border-gray-200 bg-white justify-between sticky top-0 z-10 shadow-sm">
                    <h2 class="text-xl font-light tracking-wide uppercase" x-text="currentTab"></h2>
                    <template x-if="currentTab === 'products'">
                        <div class="flex gap-4">
                            <button @click="rebuildSite" class="bg-gray-800 hover:bg-black text-white px-4 py-2 text-sm rounded transition shadow-sm border border-gray-600 flex items-center gap-2" :disabled="isRebuilding">
                                <span x-show="!isRebuilding">{{ i18n "sync_rebuild" }}</span>
                                <span x-show="isRebuilding">{{ i18n "processing" }}</span>
                            </button>
                            <button @click="openAddProductModal" class="bg-bmw-blue hover:bg-blue-700 text-white px-4 py-2 text-sm rounded transition shadow-sm">
                                + {{ i18n "add_product" }}
                            </button>
                        </div>
                    </template>
                </div>

                <div class="p-8">
                    <!-- Products Tab -->
                    <template x-if="currentTab === 'products'">
                        <div>
                            <!-- Products Stat Cards -->
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                                <div class="bg-white p-6 rounded-lg border border-gray-200 shadow-sm flex items-center transition-all duration-200 hover:shadow-md">
                                    <div class="p-3 rounded-full bg-blue-50 text-blue-600 mr-4">
                                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                                        </svg>
                                    </div>
                                    <div>
                                        <p class="text-sm font-medium text-gray-500 uppercase tracking-wider">전체 등록 상품</p>
                                        <p class="text-2xl font-bold text-gray-900" x-text="products.length + '개'"></p>
                                    </div>
                                </div>
                                <div class="bg-white p-6 rounded-lg border border-gray-200 shadow-sm flex items-center transition-all duration-200 hover:shadow-md">
                                    <div class="p-3 rounded-full bg-red-50 text-red-600 mr-4">
                                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                                        </svg>
                                    </div>
                                    <div>
                                        <p class="text-sm font-medium text-gray-500 uppercase tracking-wider">품절 또는 재고 부족</p>
                                        <p class="text-2xl font-bold text-red-600" x-text="products.filter(p => p.stock <= 0).length + '개'"></p>
                                    </div>
                                </div>
                                <div class="bg-white p-6 rounded-lg border border-gray-200 shadow-sm flex items-center transition-all duration-200 hover:shadow-md">
                                    <div class="p-3 rounded-full bg-green-50 text-green-600 mr-4">
                                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 8h6m-5 0a3 3 0 110 6H9l3 3m-3-6h6m6 1a9 9 0 11-18 0 9 9 0 0118 0z" />
                                        </svg>
                                    </div>
                                    <div>
                                        <p class="text-sm font-medium text-gray-500 uppercase tracking-wider">평균 판매가</p>
                                        <p class="text-2xl font-bold text-gray-900" x-text="(products.length ? Math.round(products.reduce((acc, p) => acc + (p.discount_price || p.price), 0) / products.length) : 0).toLocaleString() + '원'"></p>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="bg-white shadow-sm rounded border border-gray-200 overflow-hidden">
                            <!-- Product Search and Filter Bar -->
                            <div class="p-4 border-b border-gray-200 bg-gray-50 flex flex-wrap gap-4 items-center justify-between">
                                <div class="relative w-full max-w-md">
                                    <input type="text" x-model="productSearchQuery" @input.debounce.500ms="fetchProducts()" placeholder="상품명 또는 슬러그로 검색" class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-bmw-blue focus:border-bmw-blue outline-none transition text-sm bg-white">
                                    <svg class="w-5 h-5 text-gray-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                                </div>
                                <div class="flex items-center gap-2">
                                    <label class="text-sm font-medium text-gray-600">카테고리 필터:</label>
                                    <select x-model="cmsCategoryFilter" @change="fetchProducts()" class="border border-gray-300 p-2 py-1.5 rounded focus:ring-2 focus:ring-bmw-blue focus:border-bmw-blue outline-none transition text-sm bg-white min-w-[150px]">
                                        <option value="">전체보기</option>
                                        <template x-for="cat in dbCategories" :key="cat.id">
                                            <option :value="cat.id" x-text="cat.name"></option>
                                        </template>
                                    </select>
                                </div>
                            </div>
                            <table class="min-w-full divide-y divide-gray-200">
                                <thead class="bg-gray-50">
                                    <tr>
                                        <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-10"></th>
                                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">{{ i18n "product_image" }}</th>
                                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">{{ i18n "ui_name" }} / {{ i18n "ui_slug" }}</th>
                                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">카테고리</th>
                                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">{{ i18n "price" }} / {{ i18n "discount_price" }} (₩)</th>
                                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">{{ i18n "stock" }}</th>
                                        <th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">{{ i18n "actions" }}</th>
                                    </tr>
                                </thead>
                                <tbody class="bg-white divide-y divide-gray-200" :class="{'dragging-active': isProductDragging}">
                                    <template x-for="(product, pIdx) in products" :key="product.id">
                                        <tr class="hover:bg-gray-50 product-drag-row"
                                            draggable="true"
                                            @dragstart="productDragStart(pIdx, $event)"
                                            @dragover.prevent="productDragOver(pIdx, $event)"
                                            @dragleave="$event.currentTarget.classList.remove('drag-over-row')"
                                            @drop.prevent="productDrop(pIdx, $event)"
                                            @dragend="productDragEnd($event)">
                                            <td class="px-3 py-4 text-gray-400 cursor-grab active:cursor-grabbing">
                                                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M7 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM13 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM7 8a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM13 8a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM7 14a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM13 14a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>
                                            </td>
                                            <td class="px-4 py-4 whitespace-nowrap">
                                                <template x-if="product.images && product.images.length > 0">
                                                    <img :src="'/api/files/products/' + product.id + '/' + product.images[0]" class="w-12 h-12 object-cover rounded border border-gray-200 pointer-events-none">
                                                </template>
                                                <template x-if="!product.images || product.images.length === 0">
                                                    <div class="w-12 h-12 bg-gray-100 flex items-center justify-center text-xs text-gray-400 rounded border border-gray-200">IMG</div>
                                                </template>
                                            </td>
                                            <td class="px-4 py-4">
                                                <div class="text-sm font-medium text-gray-900" x-text="product.name"></div>
                                                <div class="text-sm text-gray-500" x-text="product.slug"></div>
                                            </td>
                                            <td class="px-4 py-4 whitespace-nowrap">
                                                <span x-text="product.expand?.category?.name || '미분류'" class="px-2.5 py-1 text-xs font-medium bg-gray-100 text-gray-800 rounded"></span>
                                            </td>
                                            <td class="px-4 py-4 whitespace-nowrap">
                                                <div class="text-sm font-medium text-gray-900" :class="{'line-through text-gray-400': product.discount_price > 0}" x-text="product.price.toLocaleString()"></div>
                                                <template x-if="product.discount_price > 0">
                                                    <div class="text-sm font-bold text-red-600" x-text="product.discount_price.toLocaleString()"></div>
                                                </template>
                                            </td>
                                            <td class="px-4 py-4 whitespace-nowrap text-sm text-gray-500">
                                                <input type="number" x-model.number="product.stock" @change="updateStock(product.id, product.stock)" class="w-20 border border-gray-300 p-1 text-sm rounded text-center">
                                            </td>
                                            <td class="px-4 py-4 whitespace-nowrap text-right text-sm font-medium space-x-3">
                                                <template x-if="deleteProductConfirmId !== product.id">
                                                    <div class="inline-flex gap-3">
                                                        <button @click="openEditProductModal(product)" class="text-bmw-blue hover:text-blue-900 font-medium">{{ i18n "edit_product" }}</button>
                                                        <button @click="deleteProductConfirmId = product.id" class="text-red-600 hover:text-red-900">{{ i18n "delete" }}</button>
                                                    </div>
                                                </template>
                                                <template x-if="deleteProductConfirmId === product.id">
                                                    <div class="inline-flex items-center gap-2 bg-red-50 border border-red-200 p-1.5 rounded">
                                                        <span class="text-xs text-red-700 font-medium">정말 삭제할까요?</span>
                                                        <button @click="deleteProduct(product.id)" class="bg-red-600 hover:bg-red-700 text-white text-xs px-2 py-1 rounded shadow">삭제</button>
                                                        <button @click="deleteProductConfirmId = ''" class="bg-gray-200 hover:bg-gray-300 text-gray-700 text-xs px-2 py-1 rounded">취소</button>
                                                    </div>
                                                </template>
                                            </td>
                                        </tr>
                                    </template>
                                    <template x-if="products.length === 0">
                                        <tr><td colspan="7" class="px-6 py-8 text-center text-gray-500">{{ i18n "no_products_found" }}</td></tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </template>

                    <!-- Orders Tab -->
                    <template x-if="currentTab === 'orders'">
                        <div>
                            <!-- Orders Stat Cards -->
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                                <div class="bg-white p-6 rounded-lg border border-gray-200 shadow-sm flex items-center transition-all duration-200 hover:shadow-md">
                                    <div class="p-3 rounded-full bg-green-50 text-green-600 mr-4">
                                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                        </svg>
                                    </div>
                                    <div>
                                        <p class="text-sm font-medium text-gray-500 uppercase tracking-wider">누적 총 매출</p>
                                        <p class="text-2xl font-bold text-gray-900" x-text="orders.filter(o => ['paid', 'shipping', 'completed'].includes(o.status)).reduce((acc, o) => acc + o.total_amount, 0).toLocaleString() + '원'"></p>
                                    </div>
                                </div>
                                <div class="bg-white p-6 rounded-lg border border-gray-200 shadow-sm flex items-center transition-all duration-200 hover:shadow-md">
                                    <div class="p-3 rounded-full bg-blue-50 text-blue-600 mr-4">
                                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                                        </svg>
                                    </div>
                                    <div>
                                        <p class="text-sm font-medium text-gray-500 uppercase tracking-wider">배송 대기 주문</p>
                                        <p class="text-2xl font-bold text-blue-600" x-text="orders.filter(o => o.status === 'paid').length + '건'"></p>
                                    </div>
                                </div>
                                <div class="bg-white p-6 rounded-lg border border-gray-200 shadow-sm flex items-center transition-all duration-200 hover:shadow-md" :class="{'bg-orange-50 border-orange-200': orders.filter(o => o.status === 'cancel_requested').length > 0}">
                                    <div class="p-3 rounded-full mr-4" :class="orders.filter(o => o.status === 'cancel_requested').length > 0 ? 'bg-orange-100 text-orange-600 animate-pulse' : 'bg-gray-50 text-gray-400'">
                                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                                        </svg>
                                    </div>
                                    <div>

                        <div>

                                                 @drop.prevent="editDrop(index, $event)"
                                                 @dragend="editDragEnd($event)">
                                                <!-- Thumbnail -->
                                                <div class="relative group">

                                                    <button type="button" @click.stop="removeEditImage(index)" class="absolute -top-1.5 -right-1.5 w-5 h-5 bg-red-500 hover:bg-red-600 text-white rounded-full text-xs flex items-center justify-center opacity-0 group-hover:opacity-100 transition shadow" title="삭제">&times;</button>
                                                    <!-- NEW badge -->
                                                    <template x-if="img.type === 'new'">
                                                        <span class="absolute bottom-0 left-0 right-0 bg-bmw-blue/80 text-white text-[9px] text-center py-px pointer-events-none">NEW</span>
                                                    </template>
                                                </div>
                                            </div>

                                    </div>
                                </div>
                            </template>
                            <input type="file" id="cms-edit-image-input" multiple accept="image/jpeg, image/png, image/webp" @change="onEditImageChange($event)" class="w-full border border-gray-300 p-2 rounded focus:ring-1 focus:ring-bmw-blue outline-none text-sm text-gray-500 bg-white">
                            <p class="text-xs text-gray-400 mt-1">여러 이미지를 한 번에 선택할 수 있습니다 (Ctrl/Cmd + 클릭)</p>
                        </div>
                        <div class="flex gap-4">
                            <div class="flex-1">
                                <label class="block text-sm font-medium text-gray-700 mb-1 uppercase">{{ i18n "price" }} (₩)</label>
                                <input type="number" x-model.number="editProduct.price" required class="w-full border border-gray-300 p-2 rounded focus:ring-1 focus:ring-bmw-blue outline-none">

                            <div class="flex-1">
                                <label class="block text-sm font-medium text-gray-700 mb-1 uppercase">{{ i18n "discount_price" }} (₩)</label>
                                <input type="number" x-model.number="editProduct.discount_price" class="w-full border border-gray-300 p-2 rounded focus:ring-1 focus:ring-bmw-blue outline-none">
                            </div>
                            <div class="flex-1">
                                <label class="block text-sm font-medium text-gray-700 mb-1 uppercase">{{ i18n "stock" }}</label>
                                <input type="number" x-model.number="editProduct.stock" required class="w-full border border-gray-300 p-2 rounded focus:ring-1 focus:ring-bmw-blue outline-none">
                            </div>
                        </div>
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <label class="block text-sm font-medium text-gray-700 uppercase">카테고리</label>
                                <button type="button" @click="showCatMgmt = !showCatMgmt" class="px-2.5 py-1 text-xs font-medium text-bmw-blue bg-blue-50 hover:bg-blue-100 border border-blue-200 rounded transition duration-150 flex items-center gap-1 focus:outline-none shadow-sm">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 20 20" fill="currentColor">
                                        <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd" />
                                    </svg>
                                    <span x-show="!showCatMgmt">카테고리 관리</span>
                                    <span x-show="showCatMgmt">관리 닫기</span>
                                </button>
                            </div>
                            <select x-model="editProduct.category" class="w-full border border-gray-300 p-2 rounded focus:ring-1 focus:ring-bmw-blue outline-none bg-white">
                                <option value="">— 선택 안 함 —</option>
                                <template x-for="cat in dbCategories" :key="cat.id">
                                    <option :value="cat.id" x-text="cat.name"></option>
                                </template>
                            </select>

                            <!-- Inline Category Management Panel -->
                            <div x-show="showCatMgmt" x-cloak class="mt-3 p-4 bg-gray-50 border border-gray-200 rounded text-sm space-y-4">
                                <div>
                                    <h4 class="font-semibold text-gray-800 mb-2 text-xs uppercase tracking-wider">새 카테고리 추가</h4>
                                    <div class="space-y-2">
                                        <div class="grid grid-cols-2 gap-2">
                                            <div>
                                                <label class="block text-[10px] text-gray-500 font-medium mb-1">한글 카테고리 명</label>
                                                <input type="text" placeholder="예: 신규 상품" x-model="newCatName" class="w-full border border-gray-300 p-1.5 rounded text-xs outline-none focus:ring-1 focus:ring-bmw-blue bg-white">
                                            </div>
                                            <div>
                                                <label class="block text-[10px] text-gray-500 font-medium mb-1">영문 카테고리 명</label>
                                                <input type="text" placeholder="예: New Arrivals" x-model="newCatNameEn" class="w-full border border-gray-300 p-1.5 rounded text-xs outline-none focus:ring-1 focus:ring-bmw-blue bg-white">
                                            </div>
                                        </div>
                                        <div class="grid grid-cols-2 gap-2">
                                            <div>
                                                <label class="block text-[10px] text-gray-500 font-medium mb-1">슬러그 (영문/숫자/대시)</label>
                                                <input type="text" placeholder="예: new-arrivals" x-model="newCatSlug" @input="catSlugTouched = true" class="w-full border border-gray-300 p-1.5 rounded text-xs outline-none focus:ring-1 focus:ring-bmw-blue bg-white">
                                            </div>
                                            <div class="col-span-2">
                                                <label class="block text-[10px] text-gray-500 font-medium mb-1">아이콘 선택</label>
                                                <div class="flex flex-wrap gap-1.5">
                                                    <template x-for="ic in availableIcons" :key="ic.id">
                                                        <button type="button" @click="newCatIcon = ic.id"
                                                            class="w-9 h-9 rounded-lg border-2 flex items-center justify-center transition-all duration-150 group relative"
                                                            :class="newCatIcon === ic.id ? 'border-bmw-blue bg-blue-50 shadow-sm ring-1 ring-bmw-blue/30' : 'border-gray-200 bg-white hover:border-gray-400 hover:bg-gray-50'">
                                                            <div class="w-5 h-5 text-gray-600" :class="newCatIcon === ic.id && 'text-bmw-blue'" x-html="ic.svg"></div>
                                                            <span class="absolute -bottom-5 left-1/2 -translate-x-1/2 text-[8px] text-gray-400 whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity" x-text="ic.label"></span>
                                                        </button>
                                                    </template>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="flex justify-end pt-1">
                                            <button type="button" @click="categoryAdd" class="bg-bmw-blue hover:bg-blue-700 text-white px-3 py-1.5 text-xs rounded transition font-medium" :disabled="isCatSaving">카테고리 등록</button>
                                        </div>
                                    </div>
                                </div>

                                <div class="border-t border-gray-200 pt-3">
                                    <h4 class="font-semibold text-gray-800 mb-2 text-xs uppercase tracking-wider">카테고리 목록 (삭제 시 상품 연결 해제)</h4>
                                    <div class="space-y-1.5 max-h-36 overflow-y-auto pr-1">
                                        <template x-for="cat in dbCategories" :key="cat.id">
                                            <div class="flex justify-between items-center bg-white p-2 rounded border border-gray-200 text-xs">
                                                <div>
                                                    <span class="font-semibold text-gray-700" x-text="cat.name"></span>
                                                    <span class="text-gray-400 text-[10px]" x-text="'(' + cat.slug + ')'"></span>
                                                </div>
                                                <div class="flex items-center">
                                                    <template x-if="deleteCategoryConfirmId !== cat.id">
                                                        <button type="button" @click="deleteCategoryConfirmId = cat.id" class="text-red-500 hover:text-red-700 font-medium" :disabled="isCatDeleting">삭제</button>
                                                    </template>
                                                    <template x-if="deleteCategoryConfirmId === cat.id">
                                                        <div class="inline-flex items-center gap-1.5 bg-red-50 border border-red-200 px-2 py-0.5 rounded">
                                                            <span class="text-[9px] text-red-700 font-medium">정말 삭제할까요?</span>
                                                            <button type="button" @click="categoryDelete(cat.id)" class="bg-red-600 hover:bg-red-700 text-white text-[9px] px-1.5 py-0.5 rounded shadow">확인</button>
                                                            <button type="button" @click="deleteCategoryConfirmId = ''" class="bg-gray-200 hover:bg-gray-300 text-gray-700 text-[9px] px-1.5 py-0.5 rounded">취소</button>
                                                        </div>
                                                    </template>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="pt-4 flex justify-end gap-3">
                            <button type="button" @click="showEditModal = false" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-900 border border-gray-300 rounded uppercase">{{ i18n "cancel" }}</button>
                            <button type="submit" class="px-4 py-2 text-sm text-white bg-bmw-blue hover:bg-blue-700 rounded transition uppercase" :disabled="loading">{{ i18n "save_changes" }}</button>
                        </div>
                    </form>
                </div>
            </div>
        </template>

    <script>
        const pb = new PocketBase(window.location.origin);

        function cmsApp() {
            return {
                isLoggedIn: pb.authStore.isValid && (pb.authStore.isSuperuser || pb.authStore.isAdmin),
                email: '',
                password: '',
                error: '',
                loading: false,
                isRebuilding: false,
                currentTab: 'products',
                products: [],
                orders: [],
                orderSearchQuery: '',
                productSearchQuery: '',
                cmsCategoryFilter: '',
                cancelConfirmId: '',
                deleteProductConfirmId: '',
                deleteOrderConfirmId: '',
                deleteCategoryConfirmId: '',
                cancelApproving: false,
                toastMsg: '',
                toastType: 'info',
                _toastTimer: null,
                tomlContent: '',
                showAddModal: false,
                showEditModal: false,
                slugTouched: false,
                addImageList: [],
                addImageKeyCounter: 0,
                isProductDragging: false,
                isImageDragging: false,
                editImageList: [],
                editImageKeyCounter: 0,
                // Category management state
                showCatMgmt: false,
                newCatName: '',
                newCatNameEn: '',
                newCatSlug: '',
                newCatIcon: 'lightning',
                availableIcons: [
                    { id: 'lightning', label: 'Lightning', svg: '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>' },
                    { id: 'adjustment', label: 'Adjustment', svg: '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>' },
                    { id: 'card', label: 'Card', svg: '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>' },
                    { id: 'spark', label: 'Spark', svg: '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg>' },
                    { id: 'star', label: 'Star', svg: '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>' },
                    { id: 'heart', label: 'Heart', svg: '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>' },
                    { id: 'tag', label: 'Tag', svg: '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/></svg>' },
                    { id: 'gift', label: 'Gift', svg: '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v13m0-13V6a4 4 0 00-4-4c-1.38 0-2.63.56-3.54 1.46M12 8V6a4 4 0 014-4c1.38 0 2.63.56 3.54 1.46M12 8H5.61M12 8h6.39M3 13h18v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6zm0-5h18v4H3V8z"/></svg>' },
                    { id: 'truck', label: 'Truck', svg: '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a1 1 0 01-1 1h-1m-6-1a1 1 0 001 1h1M5 17a2 2 0 104 0m-4 0a2 2 0 114 0m6 0a2 2 0 104 0m-4 0a2 2 0 114 0"/></svg>' },
                    { id: 'shield', label: 'Shield', svg: '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>' },
                    { id: 'fire', label: 'Fire', svg: '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343A7.975 7.975 0 0120 13a7.975 7.975 0 01-2.343 5.657z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.879 16.121A3 3 0 1012.015 11L11 14H9c0 .768.293 1.536.879 2.121z"/></svg>' },
                    { id: 'globe', label: 'Globe', svg: '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>' },
                ],
                isCatSaving: false,
                isCatDeleting: false,
                catSlugTouched: false,
                newProduct: {
                    name: '',
                    slug: '',
                    description: '',
                    price: '',
                    discount_price: '',
                    stock: '',
                    category: ''
                },
                editProduct: {
                    id: '',
                    name: '',
                    slug: '',
                    description: '',
                    price: '',
                    discount_price: '',
                    stock: '',
                    category: '',
                    currentImages: []
                },
                dbCategories: [],
                init() {
                    if (this.isLoggedIn) {
                        document.cookie = pb.authStore.exportToCookie({ secure: false, httpOnly: false });
                        
                        const urlParams = new URLSearchParams(window.location.search);
                        const tab = urlParams.get('tab');
                        if (tab && ['products', 'orders', 'settings'].includes(tab)) {
                            this.currentTab = tab;
                        }

                        if (this.currentTab === 'orders') {
                            this.fetchOrders();
                        } else if (this.currentTab === 'settings') {
                            this.fetchSettings();
                        } else {
                            this.fetchProducts();
                        }
                        this.fetchDbCategories();
                    }
                    // Auto-slugify new product name (supports Korean IME)
                    this.$watch('newProduct.name', val => {
                        if (!this.slugTouched) {
                            this.newProduct.slug = val.toLowerCase().replace(/[^a-z0-9가-힣ㄱ-ㅎㅏ-ㅣ]+/g, '-').replace(/-+/g, '-').replace(/(^-|-$)+/g, '');
                        }
                    });
                    // Auto-slugify new category english name
                    this.$watch('newCatNameEn', val => {
                        if (!this.catSlugTouched) {
                            this.newCatSlug = val.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/-+/g, '-').replace(/(^-|-$)+/g, '');
                        }
                    });
                },
                async fetchDbCategories() {
                    try {
                        const result = await pb.collection('categories').getFullList({ sort: 'sort_order' });
                        this.dbCategories = result;
                    } catch (err) {
                        console.error('카테고리 로드 실패:', err);
                    }
                },
                async categoryAdd() {
                    if (!this.newCatName || !this.newCatSlug) {
                        this.showToast('카테고리 이름과 슬러그는 필수입니다.');
                        return;
                    }
                    this.isCatSaving = true;
                    try {
                        const response = await pb.send('/api/cms/categories/add', {
                            method: 'POST',
                            body: {
                                name: this.newCatName,
                                nameEn: this.newCatNameEn || this.newCatName,
                                slug: this.newCatSlug,
                                icon: this.newCatIcon || 'lightning'
                            }
                        });
                        this.newCatName = '';
                        this.newCatNameEn = '';
                        this.newCatSlug = '';
                        this.newCatIcon = 'lightning';
                        this.catSlugTouched = false;
                        await this.fetchDbCategories();
                        this.showToast(response.message || '카테고리가 추가되었습니다.');
                    } catch (err) {
                        this.handleError(err, '카테고리 추가 실패');
                    } finally {
                        this.isCatSaving = false;
                    }
                },
                async categoryDelete(id) {
                    this.isCatDeleting = true;
                    try {
                        const response = await pb.send('/api/cms/categories/delete', {
                            method: 'POST',
                            body: { id }
                        });
                        
                        // Clear selected category on modals if it matches deleted ID
                        if (this.newProduct.category === id) {
                            this.newProduct.category = '';
                        }
                        if (this.editProduct.category === id) {
                            this.editProduct.category = '';
                        }
                        
                        this.deleteCategoryConfirmId = '';
                        await this.fetchDbCategories();
                        await this.fetchProducts(); // Refresh products to display updated category bindings
                        this.showToast(response.message || '카테고리가 삭제되었습니다.');
                    } catch (err) {
                        this.handleError(err, '카테고리 삭제 실패');
                    } finally {
                        this.isCatDeleting = false;
                    }
                },
                handleError(err, defaultMsg = '오류가 발생했습니다') {
                    if (err.status === 401 || err.status === 403) {
                        this.showToast('권한이 없거나 세션이 만료되었습니다. 다시 로그인해주세요.');
                        setTimeout(() => this.logout(), 2000);
                        return;
                    }
                    console.error(defaultMsg, err);
                    this.showToast(`${defaultMsg}: ${err.message || JSON.stringify(err.data || err)}`);
                },
                async rebuildSite() {
                    this.isRebuilding = true;
                    try {
                        const data = await pb.send('/api/cms/rebuild', {
                            method: 'POST'
                        });
                        // 성공: 서버에서 내려온 메시지 그대로 표시
                        const msg = data.message || '{{ i18n "site_rebuilt_success" }}';
                        this.showToast(msg, 'success', 8000);
                        // Hugo 빌드 상세 출력이 있으면 콘솔에도 기록
                        if (data.detail) {
                            console.log('[CMS Rebuild] Hugo output:\n', data.detail);
                        }
                    } catch (err) {
                        // 실패: error + detail 모두 추출해 표시
                        const errData = err.data || {};
                        const errMsg = errData.error || err.message || '빌드 실패';
                        const detail = errData.detail || '';
                        const fullMsg = detail
                            ? errMsg + '\n\n상세: ' + detail.slice(0, 400)
                            : errMsg;
                        console.error('[CMS Rebuild] Failed:', err);
                        this.showToast('동기화 실패: ' + fullMsg, 'error', 12000);
                    } finally {
                        this.isRebuilding = false;
                    }
                },
                async login() {
                    this.loading = true;
                    this.error = '';
                    try {
                        if (pb.collection && pb.collection('_superusers')) {
                            await pb.collection('_superusers').authWithPassword(this.email, this.password);
                        } else {
                            await pb.admins.authWithPassword(this.email, this.password);
                        }
                        // Save authentication state in a cookie for SSR routes
                        document.cookie = pb.authStore.exportToCookie({ secure: false, httpOnly: false });
                        this.isLoggedIn = true;
                        this.fetchProducts();
                    } catch (err) {
                        this.error = err.message || 'Invalid credentials.';
                    } finally {
                        this.loading = false;
                    }
                },
                logout() {
                    pb.authStore.clear();
                    document.cookie = 'pb_auth=; Max-Age=0; path=/';
                    this.isLoggedIn = false;
                    window.location.href = '/';
                },
                async fetchProducts() {
                    try {
                        let filters = [];
                        if (this.productSearchQuery) {
                            filters.push(`(name ~ "${this.productSearchQuery.replace(/"/g, '\\"')}" || slug ~ "${this.productSearchQuery.replace(/"/g, '\\"')}")`);
                        }
                        if (this.cmsCategoryFilter) {
                            filters.push(`category = "${this.cmsCategoryFilter}"`);
                        }
                        const filterStr = filters.join(' && ');

                        const result = await pb.collection('products').getList(1, 50, { 
                            sort: 'sort_order',
                            expand: 'category',
                            filter: filterStr || undefined
                        });
                        this.products = result.items;
                        // 상품 목록 갱신 시 기존 삭제 확인 ID 초기화
                        this.deleteProductConfirmId = '';
                    } catch (err) {
                        if (err.status === 401) this.logout();
                        console.error('Error fetching products:', err);
                    }
                },
                async fetchOrders() {
                    try {
                        let filter = '';
                        if (this.orderSearchQuery) {
                            const q = this.orderSearchQuery.replace(/"/g, '\\"');
                            filter = `id ~ "${q}" || portone_tx_id ~ "${q}" || user.email ~ "${q}" || guest_info.email ~ "${q}" || guest_info.phone ~ "${q}" || guest_info.name ~ "${q}"`;
                        }
                        const result = await pb.collection('orders').getList(1, 50, { 
                            sort: '-created',
                            expand: 'user',
                            filter: filter
                        });
                        
                        let finalOrders = result.items;
                        if (this.orderSearchQuery) {
                            const sq = this.orderSearchQuery.toLowerCase();
                            finalOrders = finalOrders.filter(o => 
                                o.id.toLowerCase().includes(sq) ||
                                (o.portone_tx_id && o.portone_tx_id.toLowerCase().includes(sq)) ||
                                (o.expand?.user?.email && o.expand.user.email.toLowerCase().includes(sq)) ||
                                (o.guest_info?.email && o.guest_info.email.toLowerCase().includes(sq)) ||
                                (o.guest_info?.phone && o.guest_info.phone.toLowerCase().includes(sq)) ||
                                (o.guest_info?.name && o.guest_info.name.toLowerCase().includes(sq))
                            );
                        }
                        this.orders = finalOrders;
                    } catch (err) {
                        if (err.status === 401) this.logout();
                        console.error('Error fetching orders:', err);
                    }
                },
                async fetchSettings() {
                    try {
                        const data = await pb.send('/api/cms/settings', { method: 'GET' });
                        this.tomlContent = data.toml || '';
                    } catch (err) {
                        if (err.status === 401) this.logout();
                        console.error('Error fetching settings:', err);
                        this.handleError(err, '설정 불러오기 실패');
                    }
                },
                async saveSettings() {
                    this.loading = true;
                    try {
                        await pb.send('/api/cms/settings/update', { 
                            method: 'POST',
                            body: { toml: this.tomlContent }
                        });
                        this.showToast('설정이 저장되었고 사이트가 재빌드되었습니다.');
                    } catch (err) {
                        this.handleError(err, '설정 저장 실패');
                    } finally {
                        this.loading = false;
                    }
                },
                async updateStock(id, newStock) {
                    try {
                        const stockValue = newStock === '' ? 0 : Number(newStock);
                        await pb.collection('products').update(id, { stock: stockValue });
                    } catch (err) {
                        this.handleError(err, '재고 업데이트 실패');
                        this.fetchProducts();
                    }
                },
                // --- Product row drag-and-drop reorder ---
                productDragIdx: null,
                productDragStart(index, event) {
                    // Guard: ignore drag from interactive form elements
                    if (['INPUT', 'SELECT', 'BUTTON', 'A'].includes(event.target.tagName)) {
                        event.preventDefault();
                        return;
                    }
                    this.productDragIdx = index;
                    event.currentTarget.classList.add('dragging-row');
                    event.dataTransfer.effectAllowed = 'move';
                    event.dataTransfer.setData('text/plain', String(index));
                    setTimeout(() => {
                        this.isProductDragging = true;
                    }, 0);
                },
                productDragOver(index, event) {
                    if (this.productDragIdx === null || this.productDragIdx === index) return;
                    event.dataTransfer.dropEffect = 'move';
                    event.currentTarget.classList.add('drag-over-row');
                },
                productDrop(targetIndex, event) {
                    event.currentTarget.classList.remove('drag-over-row');
                    const fromIndex = this.productDragIdx;
                    if (fromIndex === null || fromIndex === targetIndex) {
                        this.isProductDragging = false;
                        return;
                    }
                    const list = [...this.products];
                    list.splice(targetIndex, 0, list.splice(fromIndex, 1)[0]);
                    this.products = list;
                    this.productDragIdx = null;
                    this.isProductDragging = false;
                    this.saveProductOrder();
                },
                productDragEnd(event) {
                    event.currentTarget.classList.remove('dragging-row');
                    this.productDragIdx = null;
                    this.isProductDragging = false;
                    document.querySelectorAll('.drag-over-row').forEach(el => el.classList.remove('drag-over-row'));
                },
                async saveProductOrder() {
                    try {
                        await pb.send('/api/cms/products/reorder', {
                            method: 'POST',
                            body: { ids: this.products.map(p => p.id) }
                        });
                        this.showToast('상품 순서가 저장되었습니다.');
                    } catch (err) {
                        this.handleError(err, '순서 저장 실패');
                    }
                },
                async updateOrderStatus(id, newStatus) {
                    try {
                        await pb.collection('orders').update(id, { status: newStatus });
                        this.showToast('주문 상태가 변경되었습니다.');
                    } catch (err) {
                        this.handleError(err, '주문 상태 업데이트 실패');
                        this.fetchOrders();
                    }
                },
                async deleteProduct(id) {
                    try {
                        const orderItems = await pb.collection('order_items').getFullList({
                            filter: `product = "${id}"`
                        });
                        for (const item of orderItems) {
                            await pb.collection('order_items').delete(item.id);
                        }
                        await pb.collection('products').delete(id);
                        this.deleteProductConfirmId = '';
                        this.fetchProducts();
                        this.showToast('상품이 삭제되었습니다.');
                    } catch (err) {
                        this.handleError(err, '상품 삭제 실패');
                    }
                },
                showToast(msg, type, duration) {
                    this.toastMsg = msg;
                    this.toastType = type || 'info'; // 'info' | 'success' | 'error'
                    const ms = duration || 4000;
                    clearTimeout(this._toastTimer);
                    this._toastTimer = setTimeout(() => { this.toastMsg = ''; this.toastType = 'info'; }, ms);
                },
                isCancellable(status) {
                    const cancellableStatuses = ['cancel_requested'];
                    return cancellableStatuses.includes(status);
                },
                async approveCancel(id) {
                    this.cancelApproving = true;
                    try {
                        await pb.send('/api/cms/orders/' + id + '/approve-cancel', { method: 'POST' });
                        this.cancelConfirmId = '';
                        this.showToast('환불이 완료되었습니다.');
                        this.fetchOrders();
                    } catch (err) {
                        this.showToast(err.data?.error || err.message || '환불 처리 실패');
                    } finally {
                        this.cancelApproving = false;
                    }
                },
                async deleteOrder(id) {
                    try {
                        // Cascade: delete associated order_items first
                        const items = await pb.collection('order_items').getFullList({ filter: `order = "${id}"` });
                        for (const item of items) {
                            await pb.collection('order_items').delete(item.id);
                        }
                        await pb.collection('orders').delete(id);
                        this.deleteOrderConfirmId = '';
                        this.fetchOrders();
                        this.showToast('주문 내역이 삭제되었습니다.');
                    } catch (err) {
                        this.handleError(err, '주문 삭제 실패');
                    }
                },
                // --- Image handling for Add Product (unified list) ---
                addDragIdx: null,
                onAddImageChange(event) {
                    const files = Array.from(event.target.files);
                    if (files.length === 0) return;
                    for (const file of files) {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            this.addImageKeyCounter++;
                            this.addImageList = [...this.addImageList, {
                                file: file,
                                preview: e.target.result,
                                dragKey: 'add-' + this.addImageKeyCounter
                            }];
                        };
                        reader.readAsDataURL(file);
                    }
                    event.target.value = '';
                },
                removeAddImage(index) {
                    const list = [...this.addImageList];
                    list.splice(index, 1);
                    this.addImageList = list;
                },
                // --- Drag and drop reorder for Add Product images ---
                addDragStart(index, event) {
                    this.addDragIdx = index;
                    event.currentTarget.classList.add('dragging');
                    event.dataTransfer.effectAllowed = 'move';
                    event.dataTransfer.setData('text/plain', String(index));
                    setTimeout(() => {
                        this.isImageDragging = true;
                    }, 0);
                },
                addDragOver(index, event) {
                    if (this.addDragIdx === null || this.addDragIdx === index) return;
                    event.dataTransfer.dropEffect = 'move';
                    event.currentTarget.classList.add('drag-over');
                },
                addDrop(targetIndex, event) {
                    event.currentTarget.classList.remove('drag-over');
                    const fromIndex = this.addDragIdx;
                    if (fromIndex === null || fromIndex === targetIndex) return;
                    const list = [...this.addImageList];
                    list.splice(targetIndex, 0, list.splice(fromIndex, 1)[0]);
                    this.addImageList = list;
                    this.addDragIdx = null;
                },
                addDragEnd(event) {
                    event.currentTarget.classList.remove('dragging');
                    this.addDragIdx = null;
                    this.isImageDragging = false;
                    document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
                },
                // --- Image handling for Edit Product (unified list) ---
                onEditImageChange(event) {
                    const files = Array.from(event.target.files);
                    if (files.length === 0) return;
                    for (const file of files) {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            this.editImageKeyCounter++;
                            this.editImageList = [...this.editImageList, {
                                type: 'new',
                                file: file,
                                preview: e.target.result,
                                dragKey: 'new-' + this.editImageKeyCounter
                            }];
                        };
                        reader.readAsDataURL(file);
                    }
                    event.target.value = '';
                },
                removeEditImage(index) {
                    const list = [...this.editImageList];
                    list.splice(index, 1);
                    this.editImageList = list;
                },
                // --- Drag and drop reorder for Edit Product images ---
                editDragIdx: null,
                editDragStart(index, event) {
                    this.editDragIdx = index;
                    event.currentTarget.classList.add('dragging');
                    event.dataTransfer.effectAllowed = 'move';
                    event.dataTransfer.setData('text/plain', String(index));
                    setTimeout(() => {
                        this.isImageDragging = true;
                    }, 0);
                },
                editDragOver(index, event) {
                    if (this.editDragIdx === null || this.editDragIdx === index) return;
                    event.dataTransfer.dropEffect = 'move';
                    event.currentTarget.classList.add('drag-over');
                },
                editDrop(targetIndex, event) {
                    event.currentTarget.classList.remove('drag-over');
                    const fromIndex = this.editDragIdx;
                    if (fromIndex === null || fromIndex === targetIndex) return;
                    const list = [...this.editImageList];
                    list.splice(targetIndex, 0, list.splice(fromIndex, 1)[0]);
                    this.editImageList = list;
                    this.editDragIdx = null;
                },
                editDragEnd(event) {
                    event.currentTarget.classList.remove('dragging');
                    this.editDragIdx = null;
                    this.isImageDragging = false;
                    document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
                },
                openAddProductModal() {
                    this.newProduct = { name: '', slug: '', description: '', price: '', discount_price: '', stock: '', category: '' };
                    this.slugTouched = false;
                    this.addImageList = [];
                    this.addImageKeyCounter = 0;
                    this.showAddModal = true;
                },
                openEditProductModal(product) {
                    this.editImageKeyCounter = 0;
                    this.editProduct = {
                        id: product.id,
                        name: product.name,
                        slug: product.slug,
                        description: product.description,
                        price: product.price,
                        discount_price: product.discount_price || '',
                        stock: product.stock,
                        category: product.category || ''
                    };
                    // Build unified image list from existing images
                    this.editImageList = (product.images && product.images.length > 0)
                        ? product.images.map((img, i) => ({
                            type: 'existing',
                            filename: img,
                            preview: '/api/files/products/' + product.id + '/' + img,
                            dragKey: 'existing-' + i
                        }))
                        : [];
                    this.showEditModal = true;
                },
                async createProduct() {
                    // 유효성 검증 (보안 및 데이터 정합성 강화)
                    if (Number(this.newProduct.price) < 0 || Number(this.newProduct.stock) < 0) {
                        this.showToast('가격과 재고는 0 이상이어야 합니다.');
                        return;
                    }
                    if (Number(this.newProduct.discount_price) > 0 && Number(this.newProduct.discount_price) >= Number(this.newProduct.price)) {
                        this.showToast('할인 가격은 원래 가격보다 작아야 합니다.');
                        return;
                    }

                    this.loading = true;
                    try {
                        const formData = new FormData();
                        formData.append('name', this.newProduct.name);
                        formData.append('slug', this.newProduct.slug);
                        formData.append('description', this.newProduct.description);
                        formData.append('price', Number(this.newProduct.price) || 0);
                        formData.append('discount_price', Number(this.newProduct.discount_price) || 0);
                        formData.append('stock', Number(this.newProduct.stock) || 0);
                        if (this.newProduct.category) {
                            formData.append('category', this.newProduct.category);
                        }

                        // Use stored files from state (not $refs which don't work in x-teleport)
                        for (const img of this.addImageList) {
                            formData.append('images', img.file);
                        }

                        await pb.collection('products').create(formData);
                        this.showAddModal = false;
                        this.addImageList = [];
                        this.addImageKeyCounter = 0;
                        this.fetchProducts();
                        this.showToast('상품이 등록되었습니다.');
                    } catch (err) {
                        this.handleError(err, '상품 등록 실패');
                    } finally {
                        this.loading = false;
                    }
                },
                async updateProduct() {
                    // 유효성 검증 (보안 및 데이터 정합성 강화)
                    if (Number(this.editProduct.price) < 0 || Number(this.editProduct.stock) < 0) {
                        this.showToast('가격과 재고는 0 이상이어야 합니다.');
                        return;
                    }
                    if (Number(this.editProduct.discount_price) > 0 && Number(this.editProduct.discount_price) >= Number(this.editProduct.price)) {
                        this.showToast('할인 가격은 원래 가격보다 작아야 합니다.');
                        return;
                    }

                    this.loading = true;
                    try {
                        const formData = new FormData();
                        formData.append('name', this.editProduct.name);
                        formData.append('slug', this.editProduct.slug);
                        formData.append('description', this.editProduct.description);
                        formData.append('price', Number(this.editProduct.price) || 0);
                        formData.append('discount_price', Number(this.editProduct.discount_price) || 0);
                        formData.append('stock', Number(this.editProduct.stock) || 0);
                        // Send category (empty string clears the relation)
                        formData.append('category', this.editProduct.category || '');

                        // Send the complete ordered image list.
                        // Existing images: send filename string to keep them.
                        // New images: send File object to upload.
                        // The order in FormData determines the final order.
                        for (const img of this.editImageList) {
                            if (img.type === 'existing') {
                                formData.append('images', img.filename);
                            } else {
                                formData.append('images', img.file);
                            }
                        }

                        await pb.collection('products').update(this.editProduct.id, formData);
                        this.showEditModal = false;
                        this.editImageList = [];
                        this.fetchProducts();
                        this.showToast('상품이 수정되었습니다.');
                    } catch (err) {
                        this.handleError(err, '상품 수정 실패');
                    } finally {
                        this.loading = false;
                    }
                }
            }
        }
    </script>
</body>
</html>
