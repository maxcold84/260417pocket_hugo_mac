<div class="max-w-4xl mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-8">
        <div class="flex items-center gap-4">
            <a href="/cms" class="text-gray-500 hover:text-bmw-blue dark:text-gray-400 dark:hover:text-bmw-blue transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
            </a>
            <h1 class="text-3xl font-bold tracking-tight text-gray-900 dark:text-white">사이트 설정</h1>
        </div>
        <button form="settings-form" type="submit" class="bg-bmw-blue hover:bg-blue-700 text-white font-bold py-2 px-6 rounded transition duration-300">
            저장 및 재빌드
        </button>
    </div>

    <div class="bg-white dark:bg-bmw-surface rounded-xl border border-gray-200 dark:border-bmw-darkBorder shadow-sm overflow-hidden">
        <div class="p-6 border-b border-gray-200 dark:border-bmw-darkBorder bg-gray-50 dark:bg-black/50">
            <h2 class="text-lg font-bold text-gray-900 dark:text-white mb-2">hugo.toml 편집</h2>
            <p class="text-sm text-gray-500 dark:text-gray-400">
                메뉴 구성을 변경하려면 <code>[[menu.main]]</code> 블록을 추가하거나 수정하세요. <br/>
                <span class="text-red-500 dark:text-red-400 font-medium">주의: TOML 문법 오류 시 사이트 빌드가 실패할 수 있습니다.</span>
            </p>
        </div>
        <div class="p-6">
            <form id="settings-form" 
                  hx-post="/api/cms/settings/update" 
                  hx-swap="none"
                  hx-on::after-request="if(event.detail.successful) { alert('설정이 저장되고 빌드가 시작되었습니다.'); window.location.href='/cms'; } else { alert('설정 저장에 실패했습니다: ' + event.detail.xhr.responseText); }">
                <textarea name="toml" 
                          rows="20" 
                          class="w-full font-mono text-sm p-4 bg-gray-50 dark:bg-black border border-gray-300 dark:border-gray-700 rounded focus:ring-bmw-blue focus:border-bmw-blue dark:text-white"
                          spellcheck="false">{{ .toml }}</textarea>
            </form>
        </div>
    </div>
</div>
